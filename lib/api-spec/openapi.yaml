openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mapping
    description: Entity linking / BioMapper2 mapping operations
  - name: discovery
    description: BioMapper2 discovery endpoints (entity types, annotators, vocabularies)
  - name: flags
    description: User-scoped metabolite flag operations
  - name: jobs
    description: Job history and management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /map/batch:
    post:
      operationId: startMappingBatch
      tags: [mapping]
      summary: Start a batch mapping job
      description: |
        Submit a list of compound/entity names for entity linking via BioMapper2.
        Maximum 10,000 names per job. Returns a job_id to poll for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMapRequest"
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMapResponse"
        "400":
          description: Invalid request (e.g. too many names)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /map/stream/{jobId}:
    get:
      operationId: streamMappingProgress
      tags: [mapping]
      summary: Stream job progress via Server-Sent Events
      description: |
        Opens a persistent SSE connection that emits `progress` events until the job
        reaches a terminal state (complete or error). Each event payload is a JobResult JSON object.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of progress events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Each event has format:
                  `event: progress\ndata: <JobResult JSON>\n\n`
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/entity-types:
    get:
      operationId: listEntityTypes
      tags: [discovery]
      summary: List supported entity types
      responses:
        "200":
          description: Entity types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityType"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/annotators:
    get:
      operationId: listAnnotators
      tags: [discovery]
      summary: List available annotators
      responses:
        "200":
          description: Annotators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annotator"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/vocabularies:
    get:
      operationId: listVocabularies
      tags: [discovery]
      summary: List supported vocabularies
      responses:
        "200":
          description: Vocabularies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vocabulary"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /map/result/{jobId}:
    get:
      operationId: getMappingResult
      tags: [mapping]
      summary: Get full mapping results for a completed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "202":
          description: Job not yet complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flags:
    get:
      operationId: listFlags
      tags: [flags]
      summary: List flagged metabolite names for the authenticated user
      responses:
        "200":
          description: List of flagged metabolite names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: createFlag
      tags: [flags]
      summary: Flag a metabolite name for the authenticated user
      parameters:
        - name: name
          in: query
          required: true
          description: Metabolite name to flag
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "204":
          description: Flag created or already exists
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Flag limit reached (max 1000 per user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid name parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFlag
      tags: [flags]
      summary: Unflag a metabolite name for the authenticated user
      parameters:
        - name: name
          in: query
          required: true
          description: Metabolite name to unflag
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "204":
          description: Flag removed
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid name parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flags/all:
    get:
      operationId: listAllFlagsAggregated
      tags: [flags]
      summary: Aggregated flag counts across all users
      description: |
        Returns metabolite names and the number of distinct users who have flagged each,
        ordered by count descending. The x-clerk-user-id header is required for
        authentication but the results are not filtered by user.
      parameters:
        - name: x-clerk-user-id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated flag counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlaggedNameCountResponse"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List past jobs for the authenticated user
      responses:
        "200":
          description: List of jobs (lightweight, no results)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListItem"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get full job details including results
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job display name
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateRequest"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Job deleted
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MappingConfig:
      type: object
      properties:
        annotationMode:
          type: string
          enum: [missing, all, none]
          default: missing
        entityType:
          type: string
          description: Biolink entity type (e.g. biolink:SmallMolecule, biolink:Drug, biolink:Protein).
          default: "biolink:SmallMolecule"
        annotators:
          type: array
          nullable: true
          description: Optional list of annotator slugs to restrict mapping to. Null/omitted means use all available annotators.
          items:
            type: string
        hints:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        hintColumns:
          type: object
          description: Maps inferred CURIE prefix to original column name from uploaded file
          additionalProperties:
            type: string
          default: {}
      required: []

    EntityType:
      type: object
      properties:
        type:
          type: string
        aliases:
          type: array
          items:
            type: string
        defaultPrefixes:
          type: array
          items:
            type: string
      required: [type]

    Annotator:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
      required: [slug, name]

    Vocabulary:
      type: object
      properties:
        prefix:
          type: string
        iri:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
      required: [prefix]

    BatchMapRequest:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          maxItems: 10000
          description: List of entity names to map (max 10,000)
        config:
          $ref: "#/components/schemas/MappingConfig"
      required:
        - names

    BatchMapResponse:
      type: object
      properties:
        job_id:
          type: string
      required:
        - job_id

    MappingResultItem:
      type: object
      properties:
        name:
          type: string
        resolved:
          type: boolean
        primaryCurie:
          type: string
          nullable: true
        confidenceScore:
          type: number
          nullable: true
        confidenceTier:
          type: string
          enum: [high, medium, low, unknown]
          nullable: true
        needsReview:
          type: boolean
        identifiers:
          type: object
          description: |
            Map of vocabulary key → list of CURIEs/identifiers found for this entity.
            Keys are vocabulary identifiers (e.g. "hmdb", "chebi", "uniprot").
            Open record — backend may emit any vocabulary key the underlying
            BioMapper run produces, including ones not in the small-molecule
            preset.
          additionalProperties:
            type: array
            items:
              type: string
        kgEquivalentIds:
          type: object
          description: |
            Map of CURIE prefix to list of equivalent local identifiers from the
            knowledge graph node. Keys are native CURIE prefixes (e.g. "HMDB",
            "KEGG.COMPOUND"). Empty object when no KG match.
          additionalProperties:
            type: array
            items:
              type: string
        providedIds:
          type: object
          description: Original provided ID values from user's uploaded file, keyed by original column name
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          default: {}
        error:
          type: string
          nullable: true
        error_type:
          type: string
          nullable: true
      required:
        - name
        - resolved

    JobResult:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, processing, complete, error]
        completed:
          type: integer
        total:
          type: integer
        error_count:
          type: integer
        error_message:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/MappingResultItem"
      required:
        - job_id
        - status
        - completed
        - total
        - error_count
        - results

    JobListItem:
      type: object
      properties:
        jobId:
          type: string
        displayName:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, processing, complete, error]
        total:
          type: integer
        completed:
          type: integer
        errorCount:
          type: integer
        errorMessage:
          type: string
          nullable: true
        env:
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - jobId
        - status
        - total
        - completed
        - errorCount
        - env
        - createdAt
        - updatedAt

    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobListItem"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MappingResultItem"
            config:
              $ref: "#/components/schemas/MappingConfig"
              nullable: true

    JobUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          nullable: true

    FlaggedNameCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count

    FlaggedNameCountResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedNameCount"
        total:
          type: integer
      required:
        - items
        - total

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
