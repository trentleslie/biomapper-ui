openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mapping
    description: Entity linking / BioMapper2 mapping operations
  - name: discovery
    description: BioMapper2 discovery endpoints (entity types, annotators, vocabularies)
  - name: flags
    description: User-scoped metabolite flag operations
  - name: jobs
    description: Job history and management operations
  - name: harmonize
    description: User-scoped cohort harmonization runs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /map/batch:
    post:
      operationId: startMappingBatch
      tags: [mapping]
      summary: Start a batch mapping job
      description: |
        Submit a list of compound/entity names for entity linking via BioMapper2.
        Maximum 10,000 names per job. Returns a job_id to poll for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMapRequest"
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMapResponse"
        "400":
          description: Invalid request (e.g. too many names)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /map/stream/{jobId}:
    get:
      operationId: streamMappingProgress
      tags: [mapping]
      summary: Stream job progress via Server-Sent Events
      description: |
        Opens a persistent SSE connection that emits `progress` events until the job
        reaches a terminal state (complete or error). Each event payload is a JobResult JSON object.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of progress events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Each event has format:
                  `event: progress\ndata: <JobResult JSON>\n\n`
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/entity-types:
    get:
      operationId: listEntityTypes
      tags: [discovery]
      summary: List supported entity types
      responses:
        "200":
          description: Entity types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityType"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/annotators:
    get:
      operationId: listAnnotators
      tags: [discovery]
      summary: List available annotators
      responses:
        "200":
          description: Annotators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annotator"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/vocabularies:
    get:
      operationId: listVocabularies
      tags: [discovery]
      summary: List supported vocabularies
      responses:
        "200":
          description: Vocabularies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vocabulary"
        "502":
          description: Discovery service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /map/result/{jobId}:
    get:
      operationId: getMappingResult
      tags: [mapping]
      summary: Get full mapping results for a completed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "202":
          description: Job not yet complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flags:
    get:
      operationId: listFlags
      tags: [flags]
      summary: List flagged metabolite names for the authenticated user
      responses:
        "200":
          description: List of flagged metabolite names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: createFlag
      tags: [flags]
      summary: Flag a metabolite name for the authenticated user
      parameters:
        - name: name
          in: query
          required: true
          description: Metabolite name to flag
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "204":
          description: Flag created or already exists
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Flag limit reached (max 1000 per user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid name parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFlag
      tags: [flags]
      summary: Unflag a metabolite name for the authenticated user
      parameters:
        - name: name
          in: query
          required: true
          description: Metabolite name to unflag
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "204":
          description: Flag removed
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid name parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flags/all:
    get:
      operationId: listAllFlagsAggregated
      tags: [flags]
      summary: Aggregated flag counts across all users
      description: |
        Returns metabolite names and the number of distinct users who have flagged each,
        ordered by count descending. The x-clerk-user-id header is required for
        authentication but the results are not filtered by user.
      parameters:
        - name: x-clerk-user-id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated flag counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlaggedNameCountResponse"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List past jobs for the authenticated user
      responses:
        "200":
          description: List of jobs (lightweight, no results)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListItem"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get full job details including results
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job display name
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateRequest"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Job deleted
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/inspect:
    post:
      operationId: inspectHarmonizeFile
      tags: [harmonize]
      summary: Read a cohort file's header and row count
      description: >-
        Checks the file like a cohort upload (.csv, .tsv or .txt, UTF-8, not empty, at most
        50 MB) and returns its column names, so a screen can offer column pickers. Nothing is
        kept.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/HarmonizeInspectBody"
      responses:
        "200":
          description: Columns and data row count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeInspectResult"
        "400":
          description: Missing user ID header, or a file that cannot be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/cohorts:
    post:
      operationId: submitHarmonizeCohorts
      tags: [harmonize]
      summary: Start a two-cohort harmonization run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/HarmonizeCohortsBody"
      responses:
        "200":
          description: The new run's status (usually queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: >-
            Missing user ID header, a bad spec or file, a column the file does not have,
            duplicate labels, or a refusal from the job runner (its message, as written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The job runner already holds its limit of unfinished runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/many:
    post:
      operationId: submitHarmonizeMany
      tags: [harmonize]
      summary: Start a many-cohort harmonization run (2 to 12 files)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/HarmonizeManyBody"
      responses:
        "200":
          description: The new run's status (usually queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: >-
            Missing user ID header, fewer than 2 or more than 12 files, a spec that does not
            match the files, a bad file or column, duplicate labels, or a refusal from the job
            runner (its message, as written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The job runner already holds its limit of unfinished runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/example:
    post:
      operationId: submitHarmonizeExample
      tags: [harmonize]
      summary: Start a run on the built-in example dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonizeExampleRequest"
      responses:
        "200":
          description: The new run's status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: Missing user ID header, or the example dataset is not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The job runner already holds its limit of unfinished runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs:
    get:
      operationId: listHarmonizeRuns
      tags: [harmonize]
      summary: List the caller's harmonization runs, newest first, each with its status
      responses:
        "200":
          description: >-
            The caller's runs. A run the job runner no longer knows has state "unknown" and the
            runner's message as reason.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}:
    get:
      operationId: getHarmonizeRun
      tags: [harmonize]
      summary: Get a run's status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: Missing user ID header, or a refusal from the job runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/resume:
    post:
      operationId: resumeHarmonizeRun
      tags: [harmonize]
      summary: Resume a stalled, paused, expired or cancelled run
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: Missing user ID header, or the run cannot be resumed (runner's message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/cancel:
    post:
      operationId: cancelHarmonizeRun
      tags: [harmonize]
      summary: Cancel a run after its current batch (what was mapped is kept)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeRunStatus"
        "400":
          description: Missing user ID header, or a refusal from the job runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/report:
    get:
      operationId: getHarmonizeReport
      tags: [harmonize]
      summary: Get a finished run's report.json as written by the package
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The report exactly as the package wrote it (snake_case keys, schema_version 1,
            kind harmonize_cohorts or harmonize_many)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeReport"
        "400":
          description: Missing user ID header, or the report cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/review-items:
    get:
      operationId: listHarmonizeReviewItems
      tags: [harmonize]
      summary: One page of a finished run's review items, highest impact first
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [row, link]
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 50 (default 25)
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: A page of review items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeReviewItemsPage"
        "400":
          description: Missing user ID header, or bad paging (runner's message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/review-items/{ref}:
    get:
      operationId: getHarmonizeReviewItem
      tags: [harmonize]
      summary: One review item in full
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The review item's detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeReviewItemDetail"
        "400":
          description: Missing user ID header, or no such item in the run (runner's message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/items:
    get:
      operationId: listHarmonizeItems
      tags: [harmonize]
      summary: A finished run's reviewable items with their effective flags, in report order
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HarmonizeItemKind"
        - name: arm
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HarmonizeArm"
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 1000 (default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: >-
            One page of items. total counts the items matching the filters; flaggedTotal counts
            every flagged item of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeItemsPage"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/flags:
    put:
      operationId: setHarmonizeFlags
      tags: [harmonize]
      summary: Flag or de-flag items by ref
      description: >-
        Setting an item to the value biomapper suggested removes the organizer's override, so
        its source returns to biomapper.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonizeFlagsRequest"
      responses:
        "200":
          description: How many items were set, and the run's flagged total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeFlagsResult"
        "400":
          description: >-
            Missing user ID header, or refs that match no item (the first 10 named, then how
            many more)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/flags/bulk:
    post:
      operationId: bulkHarmonizeFlags
      tags: [harmonize]
      summary: Flag or de-flag every item matching a filter
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonizeBulkFlagsRequest"
      responses:
        "200":
          description: How many items matched, and the run's flagged total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeFlagsResult"
        "400":
          description: Missing user ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /harmonize/runs/{jobId}/flags/reset:
    post:
      operationId: resetHarmonizeFlags
      tags: [harmonize]
      summary: Drop the organizer's overrides, all of them or those named
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonizeResetFlagsRequest"
      responses:
        "200":
          description: The run's flagged total after the reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonizeResetFlagsResult"
        "400":
          description: >-
            Missing user ID header, or refs that match no item (the first 10 named, then how
            many more)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such run for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run has not finished yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MappingConfig:
      type: object
      properties:
        annotationMode:
          type: string
          enum: [missing, all, none]
          default: missing
        entityType:
          type: string
          description: Biolink entity type (e.g. biolink:SmallMolecule, biolink:Drug, biolink:Protein).
          default: "biolink:SmallMolecule"
        annotators:
          type: array
          nullable: true
          description: Optional list of annotator slugs to restrict mapping to. Null/omitted means use all available annotators.
          items:
            type: string
        hints:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        hintColumns:
          type: object
          description: Maps inferred CURIE prefix to original column name from uploaded file
          additionalProperties:
            type: string
          default: {}
      required: []

    EntityType:
      type: object
      properties:
        type:
          type: string
        aliases:
          type: array
          items:
            type: string
        defaultPrefixes:
          type: array
          items:
            type: string
      required: [type]

    Annotator:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
      required: [slug, name]

    Vocabulary:
      type: object
      properties:
        prefix:
          type: string
        iri:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
      required: [prefix]

    BatchMapRequest:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          maxItems: 10000
          description: List of entity names to map (max 10,000)
        config:
          $ref: "#/components/schemas/MappingConfig"
      required:
        - names

    BatchMapResponse:
      type: object
      properties:
        job_id:
          type: string
      required:
        - job_id

    MappingResultItem:
      type: object
      properties:
        name:
          type: string
        resolved:
          type: boolean
        primaryCurie:
          type: string
          nullable: true
        confidenceScore:
          type: number
          nullable: true
        confidenceTier:
          type: string
          enum: [high, medium, low, unknown]
          nullable: true
        maxAnnotatorScore:
          type: number
          nullable: true
          description: |
            The best score any annotator gave any node, whether or not the resolver chose
            that node. Before biomapper 1.9.0 this was confidenceScore.
        needsReview:
          type: boolean
        reviewReason:
          type: string
          enum: [not_scored, low_confidence, divergent_refmet, conflict_no_structure]
          nullable: true
          description: |
            Why a resolved row needs review. "not_scored" means the annotators did not score
            the chosen entry (not a low score). A ChEBI conflict flag takes precedence over
            the other reasons. null when no reason applies.
        chosenKgIdReview:
          type: string
          enum: [divergent_refmet, conflict_no_structure]
          nullable: true
          description: |
            Review flag set when the resolver source-weighted a small-molecule ChEBI
            conflict toward the RefMet annotator: "divergent_refmet" (RefMet node chosen
            across an InChIKey-connectivity difference) or "conflict_no_structure"
            (majority kept because no InChIKey was available to adjudicate). null when no
            review is warranted.
        identifiers:
          type: object
          description: |
            Map of vocabulary key → list of CURIEs/identifiers found for this entity.
            Keys are vocabulary identifiers (e.g. "hmdb", "chebi", "uniprot").
            Open record — backend may emit any vocabulary key the underlying
            BioMapper run produces, including ones not in the small-molecule
            preset.
          additionalProperties:
            type: array
            items:
              type: string
        kgEquivalentIds:
          type: object
          description: |
            Map of CURIE prefix to list of equivalent local identifiers from the
            knowledge graph node. Keys are native CURIE prefixes (e.g. "HMDB",
            "KEGG.COMPOUND"). Empty object when no KG match.
          additionalProperties:
            type: array
            items:
              type: string
        providedIds:
          type: object
          description: Original provided ID values from user's uploaded file, keyed by original column name
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          default: {}
        error:
          type: string
          nullable: true
        error_type:
          type: string
          nullable: true
      required:
        - name
        - resolved

    JobResult:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, processing, complete, error]
        completed:
          type: integer
        total:
          type: integer
        error_count:
          type: integer
        error_message:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/MappingResultItem"
      required:
        - job_id
        - status
        - completed
        - total
        - error_count
        - results

    JobListItem:
      type: object
      properties:
        jobId:
          type: string
        displayName:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, processing, complete, error]
        total:
          type: integer
        completed:
          type: integer
        errorCount:
          type: integer
        errorMessage:
          type: string
          nullable: true
        env:
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - jobId
        - status
        - total
        - completed
        - errorCount
        - env
        - createdAt
        - updatedAt

    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobListItem"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MappingResultItem"
            config:
              $ref: "#/components/schemas/MappingConfig"
              nullable: true

    JobUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          nullable: true

    FlaggedNameCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count

    FlaggedNameCountResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedNameCount"
        total:
          type: integer
      required:
        - items
        - total

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail

    HarmonizeInspectBody:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file

    HarmonizeInspectResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rowCount:
          type: integer
      required:
        - columns
        - rowCount

    HarmonizeCohortInput:
      type: object
      description: One cohort's columns. Every named column must be in the file's header.
      properties:
        label:
          type: string
          description: Letters, digits, '.', '-' and '_'; distinct within a run
        nameColumn:
          type: string
        keyColumn:
          type: string
          nullable: true
        vocabularies:
          type: object
          description: "Identifier columns per vocabulary, for example {\"HMDB\": [\"hmdb_id\"]}"
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - label
        - nameColumn

    HarmonizeCohortsSpec:
      type: object
      properties:
        entity:
          type: string
        category:
          type: string
          nullable: true
        a:
          $ref: "#/components/schemas/HarmonizeCohortInput"
        b:
          $ref: "#/components/schemas/HarmonizeCohortInput"
      required:
        - entity
        - a
        - b

    HarmonizeManySpec:
      type: object
      properties:
        entity:
          type: string
        category:
          type: string
          nullable: true
        remapAll:
          type: boolean
          default: false
        cohorts:
          type: array
          description: One per uploaded file, in file order
          minItems: 2
          maxItems: 12
          items:
            $ref: "#/components/schemas/HarmonizeCohortInput"
      required:
        - entity
        - cohorts

    HarmonizeCohortsBody:
      type: object
      properties:
        fileA:
          type: string
          format: binary
        fileB:
          type: string
          format: binary
        spec:
          type: string
          description: A HarmonizeCohortsSpec as a JSON string
      required:
        - fileA
        - fileB
        - spec

    HarmonizeManyBody:
      type: object
      properties:
        files:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: string
            format: binary
        spec:
          type: string
          description: A HarmonizeManySpec as a JSON string
      required:
        - files
        - spec

    HarmonizeExampleRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [two_cohort]
      required:
        - kind

    HarmonizeCohortStatus:
      type: object
      properties:
        label:
          type: string
        rows:
          type: integer
      required:
        - label
        - rows

    HarmonizeJobOwner:
      type: object
      properties:
        host:
          type: string
          nullable: true
        pid:
          type: integer
          nullable: true

    HarmonizeReviewCounts:
      type: object
      properties:
        row:
          type: integer
        link:
          type: integer
        skippedNoNode:
          type: integer
        candidatesCaptured:
          type: integer
        candidatesNotCaptured:
          type: integer
      required:
        - row
        - link
        - skippedNoNode
        - candidatesCaptured
        - candidatesNotCaptured

    HarmonizeProgress:
      type: object
      description: The latest progress update of the running arm (and cohort, on two-cohort runs)
      properties:
        function:
          type: string
        arm:
          type: string
          description: names_only, identifier or (two cohorts only) review
        cohort:
          type: string
          nullable: true
        cohorts:
          type: array
          items:
            type: string
        entitiesDone:
          type: integer
        entitiesTotal:
          type: integer
      required:
        - function
        - arm
        - entitiesDone
        - entitiesTotal

    HarmonizeRunStatus:
      type: object
      description: >-
        The package's HarmonizeStatus with camelCase keys, plus this app's kind, labels, entity
        and createdAt. summary is the package's compact summary, passed through with its own
        (snake_case and data) keys. Server paths (the package's output_dir, store_dir and each
        cohort's path) are never included. A listed run the job runner no longer knows carries only
        jobId, state "unknown", reason, kind, labels, entity and createdAt.
      properties:
        jobId:
          type: string
        state:
          type: string
          enum: [queued, running, paused, stalled, expired, cancelled, complete, failed,
                 owned_elsewhere, partial, unknown]
        reason:
          type: string
          nullable: true
        kind:
          type: string
          enum: [harmonize_cohorts, harmonize_many]
        labels:
          type: array
          items:
            type: string
        entity:
          type: string
        createdAt:
          type: string
          description: When this app recorded the run (UTC, ISO 8601)
        stage:
          type: string
          enum: [queued, mapping, building, capture, placing, done]
        cohorts:
          type: array
          items:
            $ref: "#/components/schemas/HarmonizeCohortStatus"
        entitiesTotal:
          type: integer
        entitiesMapped:
          type: integer
        rowsErrored:
          type: integer
        etaS:
          type: number
          nullable: true
        kgBuild:
          type: string
        kgVerified:
          type: boolean
        owner:
          allOf:
            - $ref: "#/components/schemas/HarmonizeJobOwner"
          nullable: true
        createdUtc:
          type: string
        updatedUtc:
          type: string
        summary:
          type: object
          nullable: true
          additionalProperties: true
        reviewItems:
          allOf:
            - $ref: "#/components/schemas/HarmonizeReviewCounts"
          nullable: true
        progress:
          $ref: "#/components/schemas/HarmonizeProgress"
      required:
        - jobId
        - state
        - kind
        - labels
        - entity
        - createdAt

    HarmonizeReport:
      type: object
      description: report.json as the package wrote it (snake_case keys)
      properties:
        schema_version:
          type: integer
        kind:
          type: string
          enum: [harmonize_cohorts, harmonize_many]
      required:
        - schema_version
        - kind
      additionalProperties: true

    HarmonizeItemKind:
      type: string
      enum: [link, group, review, unresolved]

    HarmonizeArm:
      type: string
      enum: [names_only, identifier]

    HarmonizeItemMember:
      type: object
      properties:
        cohort:
          type: string
        key:
          type: string
        name:
          type: string
          nullable: true
          description: Untrusted text from the cohort file
        chosenKgId:
          type: string
          nullable: true
      required:
        - cohort
        - key
        - name
        - chosenKgId

    HarmonizeItem:
      type: object
      properties:
        ref:
          type: string
          description: Stable across reloads, kind:arm:digest of the member rows
        kind:
          $ref: "#/components/schemas/HarmonizeItemKind"
        arm:
          $ref: "#/components/schemas/HarmonizeArm"
        members:
          type: array
          items:
            $ref: "#/components/schemas/HarmonizeItemMember"
        detail:
          type: object
          description: >-
            What the report gives for the item, camelCased (for example basis, ambiguous,
            oneToOne for a link; multiplicity, rowsPerCohort for a group; status or reason for a
            review entry; bucket and status for an unresolved or errored row), plus origin, the
            report list it came from
          additionalProperties: true
        suggested:
          type: boolean
          description: Biomapper's own flag
        flagged:
          type: boolean
          description: The effective flag, the organizer's override if any, else suggested
        source:
          type: string
          enum: [biomapper, organizer]
      required:
        - ref
        - kind
        - arm
        - members
        - detail
        - suggested
        - flagged
        - source

    HarmonizeItemsPage:
      type: object
      properties:
        total:
