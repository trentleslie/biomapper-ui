name: Deploy Biomapper UI (Dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'artifacts/**'
      - 'lib/**'
      - 'deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (defaults to dev)'
        required: false
        default: 'dev'

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          timeout: 300s
          envs: INPUT_BRANCH
          script: |
            set -e

            DEPLOY_DIR=/home/ubuntu/biomapper-ui-dev

            # Resolve branch: use input if provided, fall back to 'dev'
            BRANCH=${INPUT_BRANCH:-dev}
            echo "Deploying branch: $BRANCH"

            # Validate branch exists on remote
            if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null 2>&1; then
              echo "ERROR: Branch '$BRANCH' does not exist on origin"
              exit 1
            fi

            cd $DEPLOY_DIR

            # Capture current state for rollback reference
            PREV_SHA=$(git rev-parse HEAD)
            PREV_BRANCH=$(git branch --show-current || echo "detached")
            echo "Previous commit: $PREV_SHA (branch: $PREV_BRANCH)"

            # Pull latest code for the target branch
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Deployed commit: $(git rev-parse HEAD)"

            # Install Node dependencies (pnpm already available from initial setup)
            pnpm install --frozen-lockfile

            # Export only VITE_* vars for frontend build (avoid leaking backend secrets)
            set -a; source <(grep '^VITE_' "$DEPLOY_DIR/.env" 2>/dev/null); set +a

            # Build only production workspaces (skip mockup-sandbox which needs Replit env vars)
            pnpm run typecheck
            PORT=5173 BASE_PATH="/" pnpm --filter @workspace/frontend run build
            pnpm --filter @workspace/api-server run build

            # Sync Python dependencies (venv lives at repo root, not artifacts/python-api/)
            cd $DEPLOY_DIR/artifacts/python-api
            ~/.local/bin/uv pip install --python $DEPLOY_DIR/.venv/bin/python -r requirements.txt
            cd $DEPLOY_DIR

            # Update systemd service files (not nginx — certbot has modified it with SSL)
            sudo cp deploy/dev/biomapper-ui-dev-express.service /etc/systemd/system/
            sudo sed -i "s|\$DEPLOY_DIR|$DEPLOY_DIR|g" /etc/systemd/system/biomapper-ui-dev-express.service
            sudo cp deploy/dev/biomapper-ui-dev-python.service /etc/systemd/system/
            sudo sed -i "s|\$DEPLOY_DIR|$DEPLOY_DIR|g" /etc/systemd/system/biomapper-ui-dev-python.service
            sudo systemctl daemon-reload

            # Restart services
            sudo systemctl restart biomapper-ui-dev-python biomapper-ui-dev-express

            # Health check with retry loop (12 attempts, 5s apart = 60s max)
            # Disable set -e for the loop since curl returns non-zero when services aren't ready yet
            echo "Waiting for services to start..."
            set +e
            for i in $(seq 1 12); do
              PYTHON_OK=false
              EXPRESS_OK=false

              curl -sf http://127.0.0.1:8005/health > /dev/null 2>&1 && PYTHON_OK=true
              curl -sf http://127.0.0.1:8004/api/healthz > /dev/null 2>&1 && EXPRESS_OK=true

              if [ "$PYTHON_OK" = true ] && [ "$EXPRESS_OK" = true ]; then
                echo "Both services healthy!"
                break
              fi

              echo "Waiting for services... ($i/12) Python=$PYTHON_OK Express=$EXPRESS_OK"
              if [ "$i" -eq 12 ]; then
                echo "Timed out waiting for services to become healthy"
              fi
              sleep 5
            done
            set -e

            # Final verification
            curl -sf http://127.0.0.1:8005/health > /dev/null || {
              echo "FAILED: Python API health check"
              echo "ROLLBACK INFO: previous commit was $PREV_SHA (branch: $PREV_BRANCH)"
              exit 1
            }
            curl -sf http://127.0.0.1:8004/api/healthz > /dev/null || {
              echo "FAILED: Express API health check"
              echo "ROLLBACK INFO: previous commit was $PREV_SHA (branch: $PREV_BRANCH)"
              exit 1
            }

            echo "Dev deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Dev deployment failed! Check the SSH action logs above."
