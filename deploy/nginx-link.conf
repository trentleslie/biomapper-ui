server {
    listen 80;
    server_name link.expertintheloop.io;

    root $DEPLOY_DIR/artifacts/frontend/dist/public;
    index index.html;

    client_max_body_size 10m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Harmonization uploads: up to 12 cohort files of 50 MB each. The Python API refuses an
    # oversized file with its own message, so nginx must not cut the request off first.
    location /api/harmonize/ {
        client_max_body_size 610m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Express API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
